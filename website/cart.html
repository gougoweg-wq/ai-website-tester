<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart · Page &amp; Pine Books</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav class="nav">
    <a class="logo" href="index.html">📚 Page &amp; Pine</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="cart.html">Cart <span class="badge" id="cart-count">0</span></a></li>
      <li><a href="checkout.html">Checkout</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>
<main>
  <h1>Your cart</h1>
  <div id="cart-empty" class="hidden"><p>Your cart is empty.</p><a class="btn" href="shop.html">Go shopping</a></div>
  <div id="cart-content">
    <table>
      <thead><tr><th>Book</th><th>Price</th><th>Quantity</th><th>Line total</th><th></th></tr></thead>
      <tbody id="cart-body"></tbody>
    </table>
    <div class="summary">
      <p><span>Subtotal</span><span id="subtotal"></span></p>
      <p><span>Shipping</span><span id="shipping"></span></p>
      <p class="total"><span>Total</span><span id="total"></span></p>
      <p><button class="btn danger small" id="clear-cart">Clear cart</button><a class="btn" href="checkout.html">Checkout</a></p>
    </div>
  </div>
</main>
<footer>
  <p>© 2026 Page &amp; Pine Books · Student project</p>
  <p><a href="shop.html">Browse books</a><a href="contact.html">Contact us</a><a href="index.html#top-picks">Top picks</a></p>
</footer>
<script src="js/cart.js"></script>
<script src="js/cartpage.js"></script>
</body>
</html>
